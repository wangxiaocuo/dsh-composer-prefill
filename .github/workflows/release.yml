# Publish a release from a version tag.
#
# Pushing a `vX.Y.Z` tag validates that the tag matches package.json, runs the
# full verification set (typecheck, unit/dom tests, Host smoke test, package
# contents, and the real-host + browser end-to-end suites), publishes to npm
# with provenance, and creates the GitHub release.
#
# npm authentication uses Trusted Publishing (OIDC), so no NPM_TOKEN secret is
# required: configure the package on npmjs.com under Settings -> Publishing
# access -> Trusted publishers with repository
# `wangxiaocuo/dsh-composer-prefill` and workflow file `release.yml`. If you
# prefer an automation token instead, uncomment the NODE_AUTH_TOKEN environment
# variable below and add the secret.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      # No registry-url here on purpose: setup-node then leaves a placeholder
      # NODE_AUTH_TOKEN in the environment, which makes npm treat the publish as
      # an authenticated upload with an invalid token instead of using OIDC
      # Trusted Publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1; the npm bundled with Node 22 is
      # older and reports ENEEDAUTH instead of exchanging the OIDC token.
      - name: use a trusted-publishing capable npm
        run: npm install --global npm@11
      - name: verify npm supports Trusted Publishing
        shell: bash
        run: |
          npm_version=$(npm --version)
          echo "npm $npm_version"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`npm >= 11.5.1 is required for Trusted Publishing, got ${process.argv[1]}`)
              process.exit(1)
            }
          ' "$npm_version"
      - run: pnpm install --frozen-lockfile
      - name: verify the tag matches package.json
        # `pnpm release:check` reads the tag from GITHUB_REF_NAME, which is set
        # automatically for tag pushes; no extra argument is needed.
        run: pnpm release:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:smoke
      - run: pnpm pack:check
      - name: install a pinned DSH runtime
        shell: bash
        env:
          DSH_VERSION: 0.2.2-rc.1
        run: |
          CLI_DIR="$RUNNER_TEMP/dsh-cli"
          mkdir -p "$CLI_DIR"
          cd "$CLI_DIR"
          printf '{"name":"dsh-e2e-runtime","private":true}\n' > package.json
          pnpm add "@deepseek-ai/dsh@${DSH_VERSION}"
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: host e2e
        env:
          DSH_E2E_DSH_BIN: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: pnpm test:e2e:host
      - name: browser e2e
        env:
          DSH_E2E_DSH_BIN: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: pnpm test:e2e:browser
      - name: upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
      - name: publish to npm
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
