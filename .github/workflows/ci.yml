# Unit tests, DOM tests, host smoke test, coverage, and package contents.
#
# The compatibility matrix is Ubuntu Node 22/24 plus Windows Node 22. Node 20 is
# deliberately absent: it reached end of life in April 2026, the pinned pnpm 11
# refuses to run on Node < 22.13 (`node:sqlite`), and the DSH runtime this
# plugin loads into ships Node 24. Windows contributes the cross-platform signal
# on the current LTS baseline; platform-specific cases either inject a seam or
# skip with an explicit reason.
#
# The real-host suites boot an actual `dsh web` Host from a pinned npm-installed
# DSH runtime in a throwaway DSH_HOME: `test/e2e-host.mjs` asserts the plugin's
# real HTTP surface, and `test/e2e-browser.mjs` drives the row and the settings
# switch in headless Chromium. They run on Ubuntu only; the model call is
# stubbed in the browser suite, so no provider credentials are involved.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + dom + smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # `pnpm test` already runs every `*.test.mjs`, including client-dom.test.mjs.
      - name: unit tests
        shell: bash
        run: pnpm test 2>&1 | tee unit.log
      - name: annotate unit failures
        if: failure()
        shell: bash
        run: |
          if [ ! -f unit.log ]; then exit 0; fi
          grep -aE "✖|not ok|AssertionError|Error:|expected|actual|Uncaught" unit.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 0
      - run: pnpm test:smoke

  coverage:
    name: coverage (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: coverage over lib (thresholds)
        run: pnpm test:coverage

  pack:
    name: package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify the published file set
        run: pnpm pack:check

  e2e:
    name: real host + browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install a pinned DSH runtime
        shell: bash
        env:
          DSH_VERSION: 0.2.2-rc.1
        run: |
          CLI_DIR="$RUNNER_TEMP/dsh-cli"
          mkdir -p "$CLI_DIR"
          cd "$CLI_DIR"
          printf '{"name":"dsh-e2e-runtime","private":true}\n' > package.json
          # `--ignore-scripts` is deliberate: pnpm 11 refuses an install that
          # leaves dependency build scripts unanswered, and none of the native
          # build scripts (node-pty, koffi, …) are needed to boot `dsh web`.
          pnpm add "@deepseek-ai/dsh@${DSH_VERSION}" --ignore-scripts
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: host e2e (bundle loads, real routes, fences)
        env:
          DSH_E2E_DSH_BIN: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: pnpm test:e2e:host
      - name: browser e2e (row, accept, reroll, settings switch)
        env:
          DSH_E2E_DSH_BIN: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: pnpm test:e2e:browser
      - name: upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-failure
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
