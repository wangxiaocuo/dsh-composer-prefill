# Keep dependencies and the Actions used by CI current.
version: 2

updates:
  # Runtime and dev dependencies (pnpm-lock.yaml is updated by Dependabot).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades of the test toolchain are deliberate migrations, not
      # drop-in bumps: TypeScript 7 is the native compiler rewrite, jsdom
      # majors change the DOM surface under test, React majors need the
      # client half re-reviewed, and @types/node tracks a Node major we do not
      # support yet. Minor/patch updates stay automatic; bump these by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@deepseek-ai/cordis'
        update-types: ['version-update:semver-major']
      - dependency-name: playwright
        update-types: ['version-update:semver-major']

  # actions/checkout, pnpm/action-setup, actions/setup-node in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
